            env:
              - {name: VLLM_USE_RUST_FRONTEND, value: "1"}
              - {name: DP_SIZE_LOCAL, value: "2"}
              - {name: EXTRA_ARGS, value: "--max-num-seqs 8"}
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom: {fieldRef: {fieldPath: status.podIP}}
              - name: POD_IP
                valueFrom: {fieldRef: {fieldPath: status.podIP}}
