# SGLang multi-node, standard layout: one DP-attention group (DP=4, TP=4) over
# two pods with 2 GPUs each. Only the leader (worker-index 0) serves HTTP; the
# worker runs headless schedulers for global ranks 2 and 3. Each rank publishes
# KV events on 5557 + its global rank, on its own pod.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: dpg-sglang
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    workerTemplate:
      metadata:
        labels: {app: dpg-sglang, llm-d.ai/engine-type: sglang}
        annotations: {llm-d.ai/data-parallel-size-local: "4"}
      spec:
        tolerations:
          - {key: is_gpu, operator: Exists, effect: PreferNoSchedule}
        containers:
          - name: sglang
            image: docker.io/lmsysorg/sglang:v0.5.22
            command: ["/bin/bash", "-c"]
            args:
              - |-
                set -euo pipefail
                exec python3 -m sglang.launch_server \
                  --model-path deepseek-ai/DeepSeek-V2-Lite \
                  --trust-remote-code \
                  --host 0.0.0.0 --port 8000 \
                  --tp-size 4 --dp-size 4 --enable-dp-attention \
                  --nnodes 2 --node-rank ${LWS_WORKER_INDEX:-0} \
                  --dist-init-addr ${LWS_LEADER_ADDRESS}:5000 \
                  --context-length 16384 \
                  --enable-metrics \
                  --kv-events-config '{"publisher":"zmq","endpoint":"tcp://*:5557","topic":"kv"}'
            env:
              - {name: HF_HUB_CACHE, value: /var/cache/huggingface}
              - {name: NCCL_IB_HCA, value: ibp}
            ports:
              - {containerPort: 8000, name: http}
            resources:
              requests: {cpu: "16", memory: 128Gi, nvidia.com/gpu: "2", rdma/ib: "2"}
              limits: {memory: 128Gi, nvidia.com/gpu: "2", rdma/ib: "2"}
            securityContext:
              capabilities: {add: [IPC_LOCK, SYS_RAWIO]}
            volumeMounts:
              - {mountPath: /dev/shm, name: dshm}
              - {mountPath: /var/cache/huggingface, name: hf-cache}
        volumes:
          - name: dshm
            emptyDir: {medium: Memory, sizeLimit: 16Gi}
          - name: hf-cache
            emptyDir: {}
