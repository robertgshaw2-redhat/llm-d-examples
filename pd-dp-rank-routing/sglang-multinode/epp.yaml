# One InferencePool over the SGLang leader pod, the only pod serving HTTP. Its
# llm-d.ai/data-parallel-size-local annotation is 4 (the whole group), so the
# leader becomes rank endpoints 0-3, which are SGLang's global ranks.
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: dpg
spec:
  selector:
    matchLabels: {app: dpg-sglang, leaderworkerset.sigs.k8s.io/worker-index: "0"}
  targetPorts:
    - number: 8000
  endpointPickerRef:
    name: dpg-epp
    port: {number: 9002}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dpg-epp
data:
  config.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
      - type: openai-parser
      - type: data-parallel-rank-header
      - type: token-producer
        parameters:
          modelName: deepseek-ai/DeepSeek-V2-Lite
          vllm:
            url: "http://localhost:8100"
      - type: endpoint-notification-source
      # SGLang's HTTP server reports every rank's load at /v1/loads, including
      # ranks on other nodes; its /metrics covers only the leader's ranks.
      - type: metrics-data-source
        parameters:
          path: "/v1/loads?format=prometheus&include=core"
      - type: core-metrics-extractor
        parameters:
          engineConfigs:
            - name: sglang
              queuedRequestsSpec: sglang_num_waiting_reqs
              runningRequestsSpec: sglang_num_running_reqs
              kvUsageSpec: sglang_token_usage
              rankLabelName: dp_rank
      - type: precise-prefix-cache-producer
        parameters:
          kvEventsConfig:
            engineType: sglang
            topicFilter: "kv"
            discoverPods: true
            podDiscoveryConfig:
              socketPort: 5557
      - type: prefix-cache-scorer
        parameters:
          prefixMatchInfoProducerName: precise-prefix-cache-producer
      - type: queue-scorer
      - type: running-requests-size-scorer
      - type: inflight-load-producer
      - type: active-request-scorer
      - type: max-score-picker
      - type: single-profile-handler
    requestHandler:
      parsers:
        - pluginRef: openai-parser
    dataLayer:
      sources:
        - pluginRef: metrics-data-source
          extractors:
            - pluginRef: core-metrics-extractor
        - pluginRef: endpoint-notification-source
          extractors:
            - pluginRef: precise-prefix-cache-producer
    schedulingProfiles:
      - name: default
        plugins:
          - pluginRef: queue-scorer
          - pluginRef: running-requests-size-scorer
            weight: 2
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpg-epp
spec:
  replicas: 1
  selector:
    matchLabels: {app: dpg-epp}
  template:
    metadata:
      labels: {app: dpg-epp}
    spec:
      serviceAccountName: dpg-epp
      containers:
        - name: epp
          image: ghcr.io/robertgshaw2-redhat/llm-d-router-endpoint-picker:dp-rank-b329d2fe
          imagePullPolicy: Always
          args:
            - --pool-name=dpg
            - --pool-namespace=$(NAMESPACE)
            - --config-file=/etc/epp/config.yaml
            - --secure-serving=false
            - --metrics-endpoint-auth=false
            - --allow-experimental-plugins=true
            - --grpc-port=9002
            - --grpc-health-port=9003
            - --v=4
          env:
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {containerPort: 9002, name: grpc}
            - {containerPort: 9003, name: grpc-health}
            - {containerPort: 9090, name: metrics}
          readinessProbe:
            grpc: {port: 9003, service: readiness}
            periodSeconds: 5
          volumeMounts:
            - {mountPath: /etc/epp, name: config}
        - name: vllm-render
          image: docker.io/vllm/vllm-openai-cpu:v0.31.0
          command: [vllm, launch, render]
          args: [deepseek-ai/DeepSeek-V2-Lite, --port=8100]
      volumes:
        - name: config
          configMap: {name: dpg-epp}
---
apiVersion: v1
kind: Service
metadata:
  name: dpg-epp
spec:
  selector: {app: dpg-epp}
  ports:
    - {name: grpc, port: 9002}
    - {name: metrics, port: 9090}
