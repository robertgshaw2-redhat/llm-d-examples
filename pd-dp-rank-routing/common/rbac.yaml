kind: ServiceAccount
metadata:
  name: dpk-epp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dpk-epp
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dp-rank-epp}
subjects:
