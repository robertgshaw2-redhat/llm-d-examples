kind: ServiceAccount
metadata:
  name: dpg-epp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dpg-epp
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dp-rank-epp}
subjects:
  - {kind: ServiceAccount, name: dpg-epp}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dpr-epp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dpr-epp
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dp-rank-epp}
subjects:
  - {kind: ServiceAccount, name: dpr-epp}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dpi-epp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dpi-epp
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dp-rank-epp}
