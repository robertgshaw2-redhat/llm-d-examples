# One InferencePool over both roles and one EPP. The coordinator names the phase
# in x-llm-d-epp-profile, and header-profile-handler runs that profile. Without
# --data-parallel-size-local, each pod's llm-d.ai/data-parallel-size-local
# annotation sets its rank endpoints: 2 for prefill, 4 for decode.
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: dpx
spec:
  selector:
    matchLabels: {app: dpx-vllm}
  targetPorts:
    - number: 8000
  endpointPickerRef:
    name: dpx-epp
    port: {number: 9002}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dpx-epp
data:
  config.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
      - type: openai-parser
      - type: data-parallel-rank-header
      - type: approx-prefix-cache-producer
      - type: prefix-cache-scorer
      - type: queue-scorer
      - type: inflight-load-producer
      - type: active-request-scorer
      - type: prefill-filter
      - type: decode-filter
      - type: max-score-picker
      - type: header-profile-handler
    requestHandler:
      parsers:
        - pluginRef: openai-parser
    schedulingProfiles:
      - name: prefill
        plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-scorer
            weight: 2
          - pluginRef: queue-scorer
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker
      - name: decode
        plugins:
          - pluginRef: decode-filter
          - pluginRef: prefix-cache-scorer
            weight: 2
          - pluginRef: queue-scorer
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpx-epp
spec:
  replicas: 1
  selector:
    matchLabels: {app: dpx-epp}
  template:
    metadata:
      labels: {app: dpx-epp}
    spec:
      serviceAccountName: dpx-epp
      containers:
        - name: epp
          image: ghcr.io/robertgshaw2-redhat/llm-d-router-endpoint-picker:dp-rank-a61396f6
          imagePullPolicy: Always
          args:
            - --pool-name=dpx
            - --pool-namespace=$(NAMESPACE)
            - --config-file=/etc/epp/config.yaml
            - --secure-serving=false
            - --metrics-endpoint-auth=false
            - --allow-experimental-plugins=true
            - --grpc-port=9002
            - --grpc-health-port=9003
          env:
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {containerPort: 9002, name: grpc}
            - {containerPort: 9003, name: grpc-health}
            - {containerPort: 9090, name: metrics}
          readinessProbe:
            grpc: {port: 9003, service: readiness}
            periodSeconds: 5
          volumeMounts:
            - {mountPath: /etc/epp, name: config}
      volumes:
        - name: config
          configMap: {name: dpx-epp}
---
apiVersion: v1
kind: Service
metadata:
  name: dpx-epp
spec:
  selector: {app: dpx-epp}
  ports:
    - {name: grpc, port: 9002}
    - {name: metrics, port: 9090}
