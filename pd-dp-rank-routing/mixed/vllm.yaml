              VLLM_RS=$(python3 -c 'import os, vllm; print(os.path.join(os.path.dirname(vllm.__file__), "vllm-rs"))')
              exec "$VLLM_RS" serve deepseek-ai/DeepSeek-V2-Lite \
                --host 0.0.0.0 --port 8000 --grpc-port 50051 \
                --data-parallel-size 4 \
                --max-model-len 16384 \
