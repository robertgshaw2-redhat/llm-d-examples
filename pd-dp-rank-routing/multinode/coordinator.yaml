# Text-only P/D: prefill, then decode, each a call back into the gateway.
log_level: 2

server:
  listen_addr: ":8080"
  # Plaintext inside the cluster keeps the example short.
  secure_serving: false
  read_timeout: 30s
  write_timeout: 300s
  shutdown_timeout: 25s

gateway:
  address: "http://dpm-envoy:8081"
  max_idle_conns_per_host: 200
  idle_conn_timeout: 90s
  # Response-header timeout per phase call.
  timeout: 60s

pipeline:
  # Prefill returns kv_transfer_params; the coordinator passes them to decode,
  # which pulls the KV cache from the prefill pod over NIXL.
  kv_connector: kv-nixl
  use_openai_format: true
  steps:
    - type: prefill
    - type: decode
