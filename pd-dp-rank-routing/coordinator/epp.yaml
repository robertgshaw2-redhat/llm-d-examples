# One InferencePool and one EPP per phase. Each EPP runs with
# --data-parallel-size-local=2, so every vLLM pod (one port, DP=2 behind
# vllm-rs) becomes two endpoints, <pod>-rank-0 and <pod>-rank-1. Scorers see
# each rank's own vLLM metrics (engine="<rank>"), and data-parallel-rank-header
# sends the picked rank to vLLM as x-data-parallel-rank.
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: dpc-prefill
spec:
  selector:
    matchLabels: {app: dpc-vllm, llm-d.ai/role: prefill}
  targetPorts:
    - number: 8000
  endpointPickerRef:
    name: dpc-epp-prefill
    port: {number: 9002}
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: dpc-decode
spec:
  selector:
    matchLabels: {app: dpc-vllm, llm-d.ai/role: decode}
  targetPorts:
    - number: 8000
  endpointPickerRef:
    name: dpc-epp-decode
    port: {number: 9002}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dpc-epp
data:
  config.yaml: |
    apiVersion: llm-d.ai/v1
    kind: EndpointPickerConfig
    plugins:
      - type: openai-parser
      - type: data-parallel-rank-header
      - type: approx-prefix-cache-producer
      - type: prefix-cache-scorer
      - type: queue-scorer
      - type: inflight-load-producer
      - type: active-request-scorer
      - type: max-score-picker
      - type: single-profile-handler
    requestHandler:
      parsers:
        - pluginRef: openai-parser
    schedulingProfiles:
      - name: default
        plugins:
          - pluginRef: prefix-cache-scorer
            weight: 2
          - pluginRef: queue-scorer
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpc-epp-prefill
spec:
  replicas: 1
  selector:
    matchLabels: {app: dpc-epp-prefill}
  template:
    metadata:
      labels: {app: dpc-epp-prefill}
    spec:
      serviceAccountName: dpc-epp
      containers:
        - name: epp
          image: ghcr.io/robertgshaw2-redhat/llm-d-router-endpoint-picker:dp-rank-a61396f6
          imagePullPolicy: Always
          args:
            - --pool-name=dpc-prefill
            - --pool-namespace=$(NAMESPACE)
            - --config-file=/etc/epp/config.yaml
            - --data-parallel-size-local=2
            - --secure-serving=false
            - --metrics-endpoint-auth=false
            - --allow-experimental-plugins=true
            - --grpc-port=9002
            - --grpc-health-port=9003
          env:
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {containerPort: 9002, name: grpc}
            - {containerPort: 9003, name: grpc-health}
            - {containerPort: 9090, name: metrics}
          readinessProbe:
            grpc: {port: 9003, service: readiness}
            periodSeconds: 5
          volumeMounts:
            - {mountPath: /etc/epp, name: config}
      volumes:
        - name: config
          configMap: {name: dpc-epp}
---
apiVersion: v1
kind: Service
metadata:
  name: dpc-epp-prefill
spec:
  selector: {app: dpc-epp-prefill}
  ports:
    - {name: grpc, port: 9002}
    - {name: metrics, port: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpc-epp-decode
spec:
  replicas: 1
  selector:
    matchLabels: {app: dpc-epp-decode}
  template:
    metadata:
      labels: {app: dpc-epp-decode}
    spec:
      serviceAccountName: dpc-epp
      containers:
        - name: epp
          image: ghcr.io/robertgshaw2-redhat/llm-d-router-endpoint-picker:dp-rank-a61396f6
          imagePullPolicy: Always
          args:
            - --pool-name=dpc-decode
            - --pool-namespace=$(NAMESPACE)
            - --config-file=/etc/epp/config.yaml
            - --data-parallel-size-local=2
            - --secure-serving=false
            - --metrics-endpoint-auth=false
            - --allow-experimental-plugins=true
            - --grpc-port=9002
            - --grpc-health-port=9003
          env:
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {containerPort: 9002, name: grpc}
            - {containerPort: 9003, name: grpc-health}
            - {containerPort: 9090, name: metrics}
          readinessProbe:
            grpc: {port: 9003, service: readiness}
            periodSeconds: 5
          volumeMounts:
            - {mountPath: /etc/epp, name: config}
      volumes:
        - name: config
          configMap: {name: dpc-epp}
---
apiVersion: v1
kind: Service
metadata:
  name: dpc-epp-decode
spec:
  selector: {app: dpc-epp-decode}
  ports:
    - {name: grpc, port: 9002}
    - {name: metrics, port: 9090}
