    spec:
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.32.0
          command: ["/bin/bash", "-c"]
          args:
            - |-
              set -euo pipefail
              python3 -c "import nixl" 2>/dev/null || uv pip install --system nixl nixl-cu13
              VLLM_RS=$(python3 -c 'import os, vllm; print(os.path.join(os.path.dirname(vllm.__file__), "vllm-rs"))')
              exec "$VLLM_RS" serve deepseek-ai/DeepSeek-V2-Lite \
