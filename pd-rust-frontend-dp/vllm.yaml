# DeepSeek-V2-Lite, one prefill pod and one decode pod, DP=2 per pod.
#
# Each pod runs the vLLM Rust frontend (vllm-rs) in front of two engine
# ranks. HTTP on 8000 and gRPC (vllm.Inference) on 50051 both route to the
# engine rank the caller names: the X-data-parallel-rank HTTP header or the
# x-data-parallel-rank gRPC metadata key. Without it, vllm-rs balances
# across its ranks itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdp-prefill
spec:
  replicas: 1
  selector:
    matchLabels: {app: rdp-vllm, llm-d.ai/role: prefill}
  template:
    metadata:
      labels: {app: rdp-vllm, llm-d.ai/role: prefill}
    spec:
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.32.0
          command: ["/bin/bash", "-c"]
          args:
            - |-
              set -euo pipefail
              python3 -c "import nixl" 2>/dev/null || uv pip install --system nixl nixl-cu13
              VLLM_RS=$(python3 -c 'import os, vllm; print(os.path.join(os.path.dirname(vllm.__file__), "vllm-rs"))')
              exec "$VLLM_RS" serve deepseek-ai/DeepSeek-V2-Lite \
                --host 0.0.0.0 --port 8000 --grpc-port 50051 \
                --data-parallel-size 2 \
                --max-model-len 16384 \
                --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          env:
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: HF_HUB_CACHE, value: /var/cache/huggingface}
          ports:
            - {containerPort: 8000, name: http}
            - {containerPort: 50051, name: grpc}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 360
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: "16", memory: 128Gi, nvidia.com/gpu: "2"}
            limits: {memory: 128Gi, nvidia.com/gpu: "2"}
          volumeMounts:
            - {mountPath: /dev/shm, name: dshm}
            - {mountPath: /var/cache/huggingface, name: hf-cache}
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 16Gi}
        # Replace with a PVC or hostPath to keep the weights across restarts.
        - name: hf-cache
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
